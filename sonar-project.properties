# Configuración de SonarQube para TrackMyMoney
sonar.projectKey=trackmymoney
sonar.projectName=TrackMyMoney
sonar.projectVersion=0.1.0

# Directorios de código fuente
sonar.sources=src

# Exclusiones - Archivos que NO deben ser analizados por SonarQube
sonar.exclusions=\
  # Tests - Excluir todos los archivos de test\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.test.tsx,\
  **/*.test.jsx,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/*.spec.tsx,\
  **/*.spec.jsx,\
  # Carpetas específicas de tests\
  **/pruebas_escenarios/**,\
  **/src/lib/__tests__/**,\
  **/__tests__/**,\
  **/tests/**,\
  **/test/**,\
  # Archivos de configuración de tests\
  jest.config.js,\
  jest.setup.js,\
  run-tests.js

# Configuración de cobertura de código
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configuración adicional para TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Host de SonarQube (ajustar según tu configuración)
sonar.host.url=http://localhost:9000