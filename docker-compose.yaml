version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres-trackmymoney
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: trackmymoney
    ports:
      
"5432:5432"
  volumes:
pgdata:/var/lib/postgresql/data

volumes:
  pgdata: